<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EPIC Log">
<meta name="theme-color" content="#0d0d0f">
<title>EPIC Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0f; --panel:#161619; --panel-2:#1d1d21; --panel-3:#232329;
    --line:#2a2a30; --ink:#f4f4f2; --muted:#8a8a92; --faint:#5a5a62;
    --gold:#c8a13a; --gold-dim:#8c7228; --green:#3ba55c; --red:#d8584e;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Inter Tight',-apple-system,sans-serif;font-size:16px;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(200,161,58,0.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(200,161,58,0.05), transparent 60%);
  }
  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 150px;}

  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .brand{font-family:'Archivo Black',sans-serif;font-size:24px;letter-spacing:-0.5px;}
  .brand span{color:var(--gold);}
  .stamp{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:1px;}

  .cfg{
    background:rgba(216,88,78,0.10);border:1px solid rgba(216,88,78,0.4);
    color:#f0a8a2;border-radius:var(--radius);padding:13px 16px;margin-bottom:16px;
    font-size:13px;line-height:1.5;
  }
  .cfg b{color:#f4f4f2;}
  .cfg button{
    background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:10px;
    font-size:13px;font-weight:600;margin-top:10px;cursor:pointer;font-family:inherit;
  }

  .meta{display:flex;gap:10px;margin-bottom:16px;}
  .meta .f{flex:1;}
  .meta .f.dt{max-width:140px;}
  .lbl{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px;padding-left:2px;
  }
  input,select{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font-family:'Inter Tight',sans-serif;font-size:16px;padding:13px 14px;
    border-radius:12px;outline:none;transition:border-color .15s,background .15s;
  }
  input:focus,select:focus{border-color:var(--gold);background:var(--panel-2);}
  ::placeholder{color:#4a4a52;}
  input[inputmode=decimal],input[inputmode=numeric]{text-align:center;}

  .pickbar{display:flex;gap:10px;margin-bottom:18px;}
  .btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;
    letter-spacing:0.5px;padding:13px;border-radius:12px;cursor:pointer;
    transition:background .15s,transform .08s;
  }
  .btn:active{transform:scale(0.97);background:var(--panel-2);}

  .section{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:14px;overflow:hidden;
  }
  .sec-head{
    display:flex;align-items:center;gap:10px;padding:13px 14px;
    background:var(--panel-2);border-bottom:1px solid var(--line);
  }
  .sec-name{
    flex:1;background:transparent;border:none;color:var(--gold);
    font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:0.3px;
    padding:2px 0;outline:none;
  }
  .sec-name::placeholder{color:var(--gold-dim);}
  .icon-btn{
    background:transparent;border:none;color:var(--faint);font-size:18px;
    cursor:pointer;padding:6px 8px;line-height:1;transition:color .15s,transform .08s;
  }
  .icon-btn:active{transform:scale(0.9);}
  .icon-btn.del:active{color:var(--red);}

  .ex{border-bottom:1px solid #202024;}
  .ex:last-child{border-bottom:none;}
  .ex-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;}
  .ex-name{
    flex:1;background:transparent;border:none;color:var(--ink);
    font-weight:600;font-size:15px;padding:3px 0;outline:none;
    border-bottom:1px solid transparent;transition:border-color .15s;
  }
  .ex-name:focus{border-bottom-color:var(--gold-dim);}
  .ex-name::placeholder{color:var(--faint);}

  .set-rows{padding:2px 14px 10px;}
  .srow{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .tick{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--line);background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s,transform .1s;
  }
  .tick:active{transform:scale(0.88);}
  .tick.on{background:var(--gold);border-color:var(--gold);}
  .tick svg{width:16px;height:16px;opacity:0;transition:opacity .12s;}
  .tick.on svg{opacity:1;}
  .set-no{
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);
    width:18px;text-align:center;flex-shrink:0;
  }
  .srow.done .set-no{color:var(--gold);}
  .mini{flex:1;display:flex;align-items:center;gap:6px;}
  .mini input{
    width:100%;padding:9px 6px;font-size:15px;
    font-family:'JetBrains Mono',monospace;border-radius:10px;background:var(--panel-2);
  }
  .srow.done .mini input{background:rgba(200,161,58,0.07);border-color:var(--gold-dim);}
  .unit{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0;}
  .x{font-family:'JetBrains Mono',monospace;color:var(--faint);font-size:13px;flex-shrink:0;}
  .rm-set{
    background:transparent;border:none;color:var(--faint);font-size:18px;
    cursor:pointer;padding:4px 6px;flex-shrink:0;line-height:1;
  }
  .rm-set:active{color:var(--red);}

  .add-set{
    width:100%;background:transparent;border:1px dashed var(--line);
    color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;
    letter-spacing:0.5px;padding:9px;border-radius:10px;cursor:pointer;
    margin-top:4px;transition:border-color .15s,color .15s;
  }
  .add-set:active{border-color:var(--gold-dim);color:var(--gold);}

  .add-ex{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;background:transparent;border:none;border-top:1px solid #202024;
    color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:12px;
    font-weight:700;letter-spacing:1px;padding:14px;cursor:pointer;transition:background .15s;
  }
  .add-ex:active{background:rgba(200,161,58,0.08);}

  .add-section{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;background:var(--panel);border:1px dashed var(--gold-dim);
    color:var(--gold);font-family:'Archivo Black',sans-serif;font-size:14px;
    letter-spacing:0.5px;padding:16px;border-radius:var(--radius);cursor:pointer;
    margin-bottom:14px;transition:background .15s,transform .08s;
  }
  .add-section:active{background:var(--panel-2);transform:scale(0.99);}

  .empty{text-align:center;color:var(--faint);font-size:14px;padding:30px 16px;line-height:1.6;}

  .sec-prog{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);flex-shrink:0;}
  .sec-prog b{color:var(--gold);}

  .savebar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,transparent,var(--bg) 28%);
  }
  .totals{
    text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--muted);margin-bottom:8px;letter-spacing:0.5px;
  }
  .totals b{color:var(--gold);}
  .save-btn{
    width:100%;max-width:528px;margin:0 auto;display:flex;align-items:center;
    justify-content:center;gap:10px;background:var(--gold);color:#1a1405;border:none;
    font-family:'Archivo Black',sans-serif;font-size:17px;letter-spacing:0.3px;
    padding:18px;border-radius:var(--radius);cursor:pointer;
    transition:transform .08s,opacity .15s;box-shadow:0 8px 24px rgba(200,161,58,0.25);
  }
  .save-btn:active{transform:scale(0.98);}
  .save-btn:disabled{opacity:0.45;box-shadow:none;}

  .scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,0.6);
    backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--panel);
    border-radius:22px 22px 0 0;border-top:1px solid var(--line);
    transform:translateY(110%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
    max-height:78vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet.on{transform:translateY(0);}
  .grip{width:38px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 4px;}
  .sheet-head{padding:8px 20px 14px;display:flex;align-items:center;
    justify-content:space-between;border-bottom:1px solid var(--line);}
  .sheet-title{font-family:'Archivo Black',sans-serif;font-size:18px;}
  .sheet-x{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px;}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0 14px;}
  .sess{padding:15px 20px;border-bottom:1px solid #202024;cursor:pointer;transition:background .12s;}
  .sess:active{background:var(--panel-2);}
  .sess-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
  .sess-name{font-weight:600;font-size:15px;}
  .sess-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold-dim);}
  .sess-sub{font-size:12px;color:var(--muted);}
  .sheet-loading,.sheet-empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .sp-gold{border:2px solid rgba(255,255,255,.15);border-top-color:var(--gold);
    width:22px;height:22px;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spinner{width:16px;height:16px;border:2px solid rgba(26,20,5,0.3);
    border-top-color:#1a1405;border-radius:50%;animation:spin .7s linear infinite;}

  .toast{
    position:fixed;left:50%;bottom:130px;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:13px 22px;border-radius:30px;font-size:14px;font-weight:500;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
    display:flex;align-items:center;gap:9px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.ok{border-color:var(--green);} .toast.err{border-color:var(--red);}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .toast.ok .dot{background:var(--green);} .toast.err .dot{background:var(--red);}

  .restore{
    background:rgba(200,161,58,0.10);border:1px solid var(--gold-dim);
    border-radius:var(--radius);padding:13px 16px;margin-bottom:16px;
    font-size:13px;line-height:1.5;display:flex;align-items:center;
    justify-content:space-between;gap:12px;
  }
  .restore span b{color:var(--gold);}
  .restore .ra{display:flex;gap:8px;flex-shrink:0;}
  .restore button{
    border:none;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:700;
    cursor:pointer;font-family:'JetBrains Mono',monospace;
  }
  .restore .yes{background:var(--gold);color:#1a1405;}
  .restore .no{background:transparent;color:var(--muted);border:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">EPIC<span>.</span>LOG</div>
    <div class="stamp" id="stamp">—</div>
  </header>

  <div class="cfg" id="cfgBanner" style="display:none">
    <b>Backend not connected.</b> Paste your Google Apps Script web app URL to enable saving and loading past sessions.
    <button onclick="promptUrl()">Set URL</button>
  </div>

  <div class="restore" id="restoreBanner" style="display:none">
    <span>Unfinished session found from <b id="restoreWhen">earlier</b>. Resume it?</span>
    <div class="ra">
      <button class="yes" onclick="doRestore()">Resume</button>
      <button class="no" onclick="discardRestore()">Discard</button>
    </div>
  </div>

  <div class="pickbar">
    <button class="btn" onclick="openSheet()">&#8635;&nbsp; LOAD PREVIOUS</button>
    <button class="btn" onclick="resetSession()">&#10005;&nbsp; NEW / CLEAR</button>
  </div>

  <div class="meta">
    <div class="f">
      <div class="lbl">Session Name</div>
      <input type="text" id="sessName" placeholder="Lower / Rebuild W4D1" autocomplete="off" oninput="persist()">
    </div>
    <div class="f dt">
      <div class="lbl">Date</div>
      <input type="text" id="sessDate" placeholder="DD-MM-YYYY" inputmode="numeric" autocomplete="off" oninput="persist()">
    </div>
  </div>

  <div id="sections"></div>

  <button class="add-section" onclick="addSection()">&#65291;&nbsp; ADD SECTION</button>
</div>

<div class="savebar">
  <div class="totals" id="totals">0 sets &middot; 0 done</div>
  <button class="save-btn" id="saveBtn" onclick="save()">
    <span id="saveLabel">SAVE TO SHEET</span>
  </button>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sheet-head">
    <div class="sheet-title">Previous Sessions</div>
    <button class="sheet-x" onclick="closeSheet()">&#10005;</button>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="sheet-loading"><div class="sp-gold"></div></div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
const URL_KEY='epicLogWebAppUrl';
const DRAFT_KEY='epicLogDraft';
let model=null, uid=1;
function nid(){ return 'i'+(uid++)+Math.random().toString(36).slice(2,6); }

function getUrl(){ return localStorage.getItem(URL_KEY)||''; }
function setUrl(u){ localStorage.setItem(URL_KEY,u.trim()); }
function promptUrl(){
  const u=prompt('Paste your Apps Script Web App URL\n(ends in /exec)', getUrl());
  if(u&&u.trim()){ setUrl(u); document.getElementById('cfgBanner').style.display='none'; toast('ok','Backend connected'); }
}
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear(); }

/* ---------- crash-safe draft ---------- */
let persistT;
function persist(){
  if(!model) return;
  model.name=document.getElementById('sessName').value;
  model.date=document.getElementById('sessDate').value;
  clearTimeout(persistT);
  persistT=setTimeout(()=>{ try{ localStorage.setItem(DRAFT_KEY,JSON.stringify({t:Date.now(),model})); }catch(e){} },250);
}
function clearDraft(){ localStorage.removeItem(DRAFT_KEY); }
function checkRestore(){
  const raw=localStorage.getItem(DRAFT_KEY); if(!raw) return false;
  try{
    const d=JSON.parse(raw);
    const has=d.model&&d.model.sections&&d.model.sections.some(s=>s.exercises.length);
    if(!has) return false;
    const mins=Math.round((Date.now()-d.t)/60000);
    document.getElementById('restoreWhen').textContent=mins<1?'just now':mins<60?mins+' min ago':Math.round(mins/60)+'h ago';
    document.getElementById('restoreBanner').style.display='flex';
    window.__draft=d.model; return true;
  }catch(e){ return false; }
}
function doRestore(){
  model=window.__draft;
  // bump uid beyond any existing ids so new ids never collide
  document.getElementById('restoreBanner').style.display='none';
  hydrateMeta(); render(); toast('ok','Session resumed');
}
function discardRestore(){ clearDraft(); document.getElementById('restoreBanner').style.display='none'; }

/* ---------- model ops ---------- */
function blankModel(){ return { name:'', date:todayStr(), sections:[] }; }
function addSection(name){
  model.sections.push({ id:nid(), name:name||'', exercises:[] });
  render(); persist();
  setTimeout(()=>{ const e=document.querySelectorAll('.sec-name'); e[e.length-1]&&e[e.length-1].focus(); },30);
}
function delSection(sid){
  if(!confirm('Delete this whole section?')) return;
  model.sections=model.sections.filter(s=>s.id!==sid); render(); persist();
}
function addExercise(sid){
  const s=model.sections.find(x=>x.id===sid); if(!s) return;
  s.exercises.push({ id:nid(), name:'', sets:[ newSet(0,10) ] });
  render(); persist();
  setTimeout(()=>{
    const sec=document.querySelector('[data-sid="'+sid+'"]');
    const i=sec&&sec.querySelectorAll('.ex-name'); i&&i[i.length-1]&&i[i.length-1].focus();
  },30);
}
function delExercise(sid,eid){
  const s=model.sections.find(x=>x.id===sid); if(!s) return;
  s.exercises=s.exercises.filter(e=>e.id!==eid); render(); persist();
}
function newSet(w,r){ return { id:nid(), weight:w||0, reps:r||0, done:false }; }
function addSet(sid,eid){
  const e=findEx(sid,eid); if(!e) return;
  const last=e.sets[e.sets.length-1];
  e.sets.push(newSet(last?last.weight:0,last?last.reps:0)); render(); persist();
}
function delSet(sid,eid,setId){
  const e=findEx(sid,eid); if(!e) return;
  if(e.sets.length<=1){ toast('err','Keep at least one set'); return; }
  e.sets=e.sets.filter(s=>s.id!==setId); render(); persist();
}
function findEx(sid,eid){
  const s=model.sections.find(x=>x.id===sid); return s?s.exercises.find(e=>e.id===eid):null;
}
function toggleSet(sid,eid,setId){
  const e=findEx(sid,eid); if(!e) return;
  const st=e.sets.find(s=>s.id===setId); if(!st) return;
  st.done=!st.done; render(); persist();
}
function editField(sid,eid,setId,field,val){
  const e=findEx(sid,eid); if(!e) return;
  const st=e.sets.find(s=>s.id===setId); if(!st) return;
  st[field]= val===''?0:parseFloat(val);
  persist(); updateTotals();
}
function setExName(sid,eid,val){ const e=findEx(sid,eid); if(e){ e.name=val; persist(); } }
function setSecName(sid,val){ const s=model.sections.find(x=>x.id===sid); if(s){ s.name=val; persist(); } }

/* ---------- render ---------- */
const CHECK_SVG='<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#1a1405" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function render(){
  const root=document.getElementById('sections');
  if(model.sections.length===0){
    root.innerHTML='<div class="empty">No sections yet.<br>Tap <b style="color:var(--gold)">&#65291; ADD SECTION</b> to start &mdash; e.g. Warmup, Main, Super Set.</div>';
    updateTotals(); return;
  }
  root.innerHTML=model.sections.map(function(sec){
    const exHtml=sec.exercises.map(function(ex){
      const setRows=ex.sets.map(function(st,i){
        return '<div class="srow '+(st.done?'done':'')+'">'
          +'<button class="tick '+(st.done?'on':'')+'" onclick="toggleSet(\''+sec.id+'\',\''+ex.id+'\',\''+st.id+'\')">'+CHECK_SVG+'</button>'
          +'<span class="set-no">'+(i+1)+'</span>'
          +'<div class="mini">'
          +'<input inputmode="decimal" value="'+(st.weight||'')+'" placeholder="0" onfocus="this.select()" oninput="editField(\''+sec.id+'\',\''+ex.id+'\',\''+st.id+'\',\'weight\',this.value)">'
          +'<span class="unit">kg</span><span class="x">&times;</span>'
          +'<input inputmode="numeric" value="'+(st.reps||'')+'" placeholder="0" onfocus="this.select()" oninput="editField(\''+sec.id+'\',\''+ex.id+'\',\''+st.id+'\',\'reps\',this.value)">'
          +'<span class="unit">reps</span></div>'
          +'<button class="rm-set" onclick="delSet(\''+sec.id+'\',\''+ex.id+'\',\''+st.id+'\')">&minus;</button>'
          +'</div>';
      }).join('');
      return '<div class="ex" data-eid="'+ex.id+'">'
        +'<div class="ex-head">'
        +'<input class="ex-name" value="'+escAttr(ex.name)+'" placeholder="Exercise name" oninput="setExName(\''+sec.id+'\',\''+ex.id+'\',this.value)">'
        +'<button class="icon-btn del" onclick="delExercise(\''+sec.id+'\',\''+ex.id+'\')">&#128465;</button>'
        +'</div><div class="set-rows">'+setRows
        +'<button class="add-set" onclick="addSet(\''+sec.id+'\',\''+ex.id+'\')">&#65291; ADD SET</button>'
        +'</div></div>';
    }).join('');
    const tot=sec.exercises.reduce(function(a,e){return a+e.sets.length;},0);
    const dn=sec.exercises.reduce(function(a,e){return a+e.sets.filter(function(s){return s.done;}).length;},0);
    return '<div class="section" data-sid="'+sec.id+'">'
      +'<div class="sec-head">'
      +'<input class="sec-name" value="'+escAttr(sec.name)+'" placeholder="Section (Warmup, Main, Super Set...)" oninput="setSecName(\''+sec.id+'\',this.value)">'
      +'<span class="sec-prog"><b>'+dn+'</b>/'+tot+'</span>'
      +'<button class="icon-btn del" onclick="delSection(\''+sec.id+'\')">&#128465;</button>'
      +'</div>'+exHtml
      +'<button class="add-ex" onclick="addExercise(\''+sec.id+'\')">&#65291; ADD EXERCISE</button>'
      +'</div>';
  }).join('');
  updateTotals();
}
function updateTotals(){
  let t=0,d=0;
  model.sections.forEach(function(s){ s.exercises.forEach(function(e){ e.sets.forEach(function(st){ t++; if(st.done) d++; }); }); });
  document.getElementById('totals').innerHTML='<b>'+t+'</b> sets &middot; <b>'+d+'</b> done';
}
function escAttr(s){ return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ---------- save ---------- */
function flatten(){
  const rows=[];
  model.sections.forEach(function(sec){
    sec.exercises.forEach(function(ex){
      ex.sets.forEach(function(st,i){
        rows.push({ date:model.date||todayStr(), session:model.name||'Session',
          section:sec.name||'', exercise:ex.name||'(unnamed)', setNo:i+1,
          weight:st.weight||0, reps:st.reps||0, done:st.done?'Y':'N' });
      });
    });
  });
  return rows;
}
async function save(){
  const url=getUrl(), rows=flatten();
  if(rows.length===0){ toast('err','Add at least one exercise'); return; }
  if(!url){ toast('err','Set the backend URL first'); promptUrl(); return; }
  const btn=document.getElementById('saveBtn'), lbl=document.getElementById('saveLabel');
  btn.disabled=true; lbl.innerHTML='<span class="spinner"></span>';
  try{
    const res=await fetch(url,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'append',rows}) });
    const data=await res.json();
    if(data.ok){ toast('ok',rows.length+' sets saved'); clearDraft(); }
    else{ toast('err',data.error||'Save failed'); }
  }catch(e){ toast('err','Network error - check URL'); }
  finally{ btn.disabled=false; lbl.textContent='SAVE TO SHEET'; }
}

/* ---------- load previous (template) ---------- */
async function openSheet(){
  const url=getUrl();
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  const body=document.getElementById('sheetBody');
  if(!url){ body.innerHTML='<div class="sheet-empty">Set the backend URL first.</div>'; return; }
  body.innerHTML='<div class="sheet-loading"><div class="sp-gold"></div></div>';
  try{
    const res=await fetch(url+'?action=sessions');
    const data=await res.json();
    if(!data.ok){ body.innerHTML='<div class="sheet-empty">'+(data.error||'Failed')+'</div>'; return; }
    const s=data.sessions||[];
    if(!s.length){ body.innerHTML='<div class="sheet-empty">No sessions logged yet.</div>'; return; }
    body.innerHTML=s.map(function(x,i){
      return '<div class="sess" onclick="loadSession('+i+')">'
        +'<div class="sess-top"><div class="sess-name">'+escAttr(x.session)+'</div>'
        +'<div class="sess-date">'+escAttr(x.date)+'</div></div>'
        +'<div class="sess-sub">'+x.exercises+' exercises &middot; '+x.totalSets+' sets</div></div>';
    }).join('');
    window.__sessions=s;
  }catch(e){ body.innerHTML='<div class="sheet-empty">Network error.</div>'; }
}
function loadSession(i){
  const s=window.__sessions[i];
  if(!s||!s.structure){ toast('err','Could not load'); return; }
  model={ name:s.session, date:todayStr(), sections:[] };
  s.structure.forEach(function(sec){
    const ns={ id:nid(), name:sec.section||'', exercises:[] };
    sec.exercises.forEach(function(ex){
      const ne={ id:nid(), name:ex.exercise||'', sets:[] };
      for(let k=0;k<ex.count;k++) ne.sets.push(newSet(ex.weight,ex.reps));
      ns.exercises.push(ne);
    });
    model.sections.push(ns);
  });
  hydrateMeta(); render(); persist(); closeSheet();
  toast('ok','Loaded - adjust and tick as you go');
}
function closeSheet(){
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}

/* ---------- reset / init ---------- */
function resetSession(){
  if(model.sections.some(function(s){return s.exercises.length;})){
    if(!confirm('Start a fresh session? Current one will be cleared (unsaved data lost).')) return;
  }
  clearDraft(); model=blankModel(); hydrateMeta(); render();
}
function hydrateMeta(){
  document.getElementById('sessName').value=model.name||'';
  document.getElementById('sessDate').value=model.date||todayStr();
}
let toastT;
function toast(kind,msg){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  t.className='toast on '+kind;
  clearTimeout(toastT);
  toastT=setTimeout(function(){ t.className='toast '+kind; },2600);
}

/* boot */
document.getElementById('stamp').textContent=todayStr();
model=blankModel(); hydrateMeta();
checkRestore();
render();
if(!getUrl()){ document.getElementById('cfgBanner').style.display='block'; }
document.addEventListener('visibilitychange',function(){ if(document.hidden) persist(); });
window.addEventListener('pagehide', persist);
</script>
</body>
